name: Release

# Builds four platform/arch binaries, smoke-tests each, then publishes a
# GitHub Release with binaries + SHA-256 checksums.
#
# No darwin-amd64 (Intel Mac) leg: that requires either a genuine Intel
# hosted runner (the "-large" macOS labels, which need a GitHub Team/
# Enterprise plan we don't have on this personal account) or a
# cross-compiled, unverifiable-by-smoke-test build. Intel Mac users fall
# back to Docker or build-from-source (see README's Installation section)
# until that changes.
#
# Release creation uses the `gh` CLI, which ships preinstalled on
# GitHub-hosted runners. The one third-party action, sigstore/cosign-
# installer, exists so every binary is also signed (keyless, via GitHub's
# own OIDC identity -- no static signing key for this repo to manage or
# leak) rather than relying on an unsigned SHA-256 checksum alone, which
# only detects transit corruption, not a compromised release pipeline.
#
# scripts/install.sh resolves "latest" via GitHub's own redirect, so
# there's no version string inside it to bump on release — unlike the
# doc's pipeline diagram, this workflow has no separate "update install.sh"
# step.

on:
  push:
    tags: ["v*"]

# Workflow-level default; both jobs below already set their own narrower
# permissions (read+id-token for build, write for publish) -- this only
# matters as a fail-safe for any job added later that forgets to.
permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.name }})
    permissions:
      contents: read
      id-token: write # cosign keyless signing: exchanged for a Fulcio cert via GitHub's OIDC issuer, no static key
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            os: ubuntu-24.04
            spec: packaging/linux.spec
            binary: rivulets-linux-amd64
          - name: linux-arm64
            os: ubuntu-24.04-arm
            spec: packaging/linux.spec
            binary: rivulets-linux-arm64
          - name: darwin-arm64
            os: macos-15
            spec: packaging/macos.spec
            binary: rivulets-darwin-arm64
          - name: windows-amd64
            os: windows-2025
            spec: packaging/windows.spec
            binary: rivulets-windows-amd64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.3"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Build UI
        working-directory: ui
        run: |
          npm ci
          npm run build

      - name: Build binary
        working-directory: server
        run: |
          uv sync --group packaging
          uv run --group packaging pyinstaller ../${{ matrix.spec }} --distpath ../dist --workpath ../build/pyinstaller --noconfirm

      # Health-only used to be the whole release smoke test -- none of the
      # P0 launch blockers below (wrong frozen version, no migrations
      # exercised, restore broken) would have failed this job (#254).
      - name: Smoke test (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          chmod +x dist/${{ matrix.binary }}
          export RIVULETS_WORKSPACE_DIR="$(mktemp -d)"
          ./dist/${{ matrix.binary }} &
          PID=$!
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:8484/api/v1/health && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8484/api/v1/health | grep '"status":"ok"'

          # UI is actually bundled into this binary, not just an API-only
          # server.
          curl -sf http://127.0.0.1:8484/ | grep -q '<title>Rivulets</title>'

          # Frozen binary reports the tag it was actually built from, not
          # a stale fallback literal (#230).
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          curl -sf http://127.0.0.1:8484/api/v1/info | grep -q "\"version\":\"${TAG_VERSION}\""

          TOKEN=$(curl -sf -X POST http://127.0.0.1:8484/api/v1/auth/login \
            -H "Content-Type: application/json" \
            -d '{"key":"abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon about"}' \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['token'])")

          curl -sf -X POST http://127.0.0.1:8484/api/v1/agents \
            -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
            -d '{"name":"smoke-test","description":"Smoke test agent for release","instructions":"You are a test agent. Respond with OK.","model":"test:mock"}' \
            | grep -q '"name":"smoke-test"'

          # Backup/restore round trip (#243/#254): snapshot now, add a
          # second agent only after the snapshot, restore, then confirm
          # the pre-snapshot agent survived and the post-snapshot one
          # didn't -- proving restore actually swaps state back on this
          # platform's filesystem rather than being a no-op.
          BACKUP_FILE=$(curl -sf -X POST http://127.0.0.1:8484/api/v1/backups \
            -H "Authorization: Bearer $TOKEN" \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['filename'])")

          curl -sf -X POST http://127.0.0.1:8484/api/v1/agents \
            -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
            -d '{"name":"post-backup-agent","description":"should not survive restore","instructions":"noop","model":"test:mock"}' \
            | grep -q '"name":"post-backup-agent"'

          curl -sf -X POST "http://127.0.0.1:8484/api/v1/backups/${BACKUP_FILE}/restore" \
            -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
            -d "{\"confirm_filename\":\"${BACKUP_FILE}\"}"

          RESTORED_AGENTS=$(curl -sf http://127.0.0.1:8484/api/v1/agents -H "Authorization: Bearer $TOKEN")
          echo "$RESTORED_AGENTS" | grep -q 'smoke-test'
          if echo "$RESTORED_AGENTS" | grep -q 'post-backup-agent'; then
            echo "restore did not revert the post-snapshot agent" >&2
            exit 1
          fi

          kill $PID

      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:RIVULETS_WORKSPACE_DIR = New-TemporaryFile | %{ rm $_; mkdir $_ }
          $proc = Start-Process -FilePath "dist\${{ matrix.binary }}" -PassThru
          $ok = $false
          for ($i = 0; $i -lt 20; $i++) {
            try {
              $resp = Invoke-RestMethod -Uri "http://127.0.0.1:8484/api/v1/health" -TimeoutSec 2
              if ($resp.status -eq "ok") { $ok = $true; break }
            } catch {}
            Start-Sleep -Seconds 1
          }
          if (-not $ok) {
            Stop-Process -Id $proc.Id -ErrorAction SilentlyContinue
            Write-Error "Binary never reported healthy"
            exit 1
          }

          try {
            # UI is actually bundled into this binary, not just an
            # API-only server.
            $html = Invoke-RestMethod -Uri "http://127.0.0.1:8484/"
            if ($html -notmatch '<title>Rivulets</title>') {
              throw "UI index.html was not served at /"
            }

            # Frozen binary reports the tag it was actually built from,
            # not a stale fallback literal (#230).
            $tagVersion = $env:GITHUB_REF_NAME -replace '^v', ''
            $info = Invoke-RestMethod -Uri "http://127.0.0.1:8484/api/v1/info"
            if ($info.version -ne $tagVersion) {
              throw "Expected /info version $tagVersion, got $($info.version)"
            }

            $loginBody = @{ key = "abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon about" } | ConvertTo-Json
            $login = Invoke-RestMethod -Uri "http://127.0.0.1:8484/api/v1/auth/login" -Method Post -ContentType "application/json" -Body $loginBody
            $headers = @{ Authorization = "Bearer $($login.token)" }

            $agentBody = @{ name = "smoke-test"; description = "Smoke test agent for release"; instructions = "You are a test agent. Respond with OK."; model = "test:mock" } | ConvertTo-Json
            Invoke-RestMethod -Uri "http://127.0.0.1:8484/api/v1/agents" -Method Post -Headers $headers -ContentType "application/json" -Body $agentBody | Out-Null

            # Backup/restore round trip (#243/#254), same rationale as the
            # Linux/macOS leg -- this is the platform most likely to hit a
            # file-locking issue while swapping the SQLite file back in.
            $backup = Invoke-RestMethod -Uri "http://127.0.0.1:8484/api/v1/backups" -Method Post -Headers $headers
            $backupFile = $backup.filename

            $postBody = @{ name = "post-backup-agent"; description = "should not survive restore"; instructions = "noop"; model = "test:mock" } | ConvertTo-Json
            Invoke-RestMethod -Uri "http://127.0.0.1:8484/api/v1/agents" -Method Post -Headers $headers -ContentType "application/json" -Body $postBody | Out-Null

            $restoreBody = @{ confirm_filename = $backupFile } | ConvertTo-Json
            Invoke-RestMethod -Uri "http://127.0.0.1:8484/api/v1/backups/$backupFile/restore" -Method Post -Headers $headers -ContentType "application/json" -Body $restoreBody | Out-Null

            $agents = Invoke-RestMethod -Uri "http://127.0.0.1:8484/api/v1/agents" -Headers $headers
            $names = @($agents | ForEach-Object { $_.name })
            if ($names -notcontains "smoke-test") {
              throw "smoke-test agent missing after restore"
            }
            if ($names -contains "post-backup-agent") {
              throw "restore did not revert the post-snapshot agent"
            }
          } finally {
            Stop-Process -Id $proc.Id -ErrorAction SilentlyContinue
          }

      - name: Checksum
        shell: bash
        run: |
          cd dist
          if command -v sha256sum >/dev/null; then
            sha256sum "${{ matrix.binary }}" > "${{ matrix.binary }}.sha256"
          else
            shasum -a 256 "${{ matrix.binary }}" > "${{ matrix.binary }}.sha256"
          fi

      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1

      - name: Sign binary (keyless, Sigstore)
        shell: bash
        run: |
          cd dist
          cosign sign-blob --yes \
            --output-signature "${{ matrix.binary }}.sig" \
            --output-certificate "${{ matrix.binary }}.pem" \
            "${{ matrix.binary }}"

      # Release smoke test (issue #245): verify the signature this job just
      # produced against the exact identity/issuer check install.sh,
      # install.ps1, and update.py apply to every download, so a broken cert/signature pair
      # (or a workflow edit that silently weakens the identity regexp) fails
      # the release itself instead of only surfacing once a user installs.
      - name: Verify signature (release smoke test)
        shell: bash
        run: |
          cd dist
          cosign verify-blob \
            --certificate "${{ matrix.binary }}.pem" \
            --signature "${{ matrix.binary }}.sig" \
            --certificate-identity-regexp "^https://github.com/${{ github.repository }}/.github/workflows/release.yml@.+\$" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${{ matrix.binary }}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.binary }}
          path: |
            dist/${{ matrix.binary }}
            dist/${{ matrix.binary }}.sha256
            dist/${{ matrix.binary }}.sig
            dist/${{ matrix.binary }}.pem
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # only this job needs to create the release; build only needs read + id-token
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist/* \
            --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes
