name: CI

# Runs on every push to main/dev/staging and on PRs targeting them: lint +
# type-check + unit tests for both server and ui in parallel, then a build
# check and an integration smoke test against the packaged binary.
#
# Branch names here (dev/staging/main) match the actual promotion pipeline
# (dev -> staging -> main) — this originally said "develop", which isn't a
# real branch in this repo and meant CI silently never ran on PRs into dev
# or staging.
#
# Actions below are pinned to commit SHAs (with the version they currently
# resolve to as a trailing comment, for readability and Dependabot) rather
# than mutable major-version tags -- a compromised/retagged action can't
# silently change what runs here. Bumping a version means re-resolving and
# updating both the SHA and the comment together.

on:
  push:
    branches: [main, dev, staging]
  pull_request:
    branches: [main, dev, staging]

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

jobs:
  lint-server:
    name: Lint (server)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "latest"
      - working-directory: server
        run: |
          uv sync --dev
          uv run ruff check .
          uv run ruff format --check .

  typecheck-server:
    name: Type check (server)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "latest"
      - working-directory: server
        run: |
          uv sync --dev
          uv run pyright

  test-server:
    name: Unit tests (server)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "latest"
      - working-directory: server
        run: |
          uv sync --dev
          uv run pytest --cov-fail-under=95

  lint-ui:
    name: Lint (ui)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - working-directory: ui
        run: |
          npm ci
          npm run lint

  typecheck-ui:
    name: Type check (ui)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - working-directory: ui
        run: |
          npm ci
          npm run check

  test-ui:
    name: Unit tests (ui)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - working-directory: ui
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run test:coverage

  build-check:
    name: Build check
    needs: [lint-server, typecheck-server, test-server, lint-ui, typecheck-ui, test-ui]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "latest"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Build UI
        working-directory: ui
        run: |
          npm ci
          npm run build
      - name: Build server binary (PyInstaller)
        working-directory: server
        run: |
          uv sync --group packaging
          uv run --group packaging pyinstaller ../packaging/linux.spec \
            --distpath ../dist --workpath ../build/pyinstaller --noconfirm
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rivulets-linux-amd64
          path: dist/rivulets-linux-amd64
          retention-days: 7

  integration-test:
    name: Integration test (health, create agent, verify)
    needs: build-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rivulets-linux-amd64
          path: dist
      # Smoke test script: start binary, health check, create an agent via
      # the API, verify it exists.
      - name: Smoke test
        run: |
          chmod +x dist/rivulets-linux-amd64
          export RIVULETS_WORKSPACE_DIR="$(mktemp -d)"
          ./dist/rivulets-linux-amd64 &
          PID=$!
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:8484/api/v1/health && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8484/api/v1/health | grep '"status":"ok"'

          TOKEN=$(curl -sf -X POST http://127.0.0.1:8484/api/v1/auth/login \
            -H "Content-Type: application/json" \
            -d '{"key":"abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon about"}' \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['token'])")

          curl -sf -X POST http://127.0.0.1:8484/api/v1/agents \
            -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
            -d '{"name":"smoke-test","description":"Smoke test agent for CI","instructions":"You are a test agent. Respond with OK.","model":"test:mock"}' \
            | grep '"name":"smoke-test"'

          curl -sf http://127.0.0.1:8484/api/v1/agents \
            -H "Authorization: Bearer $TOKEN" | grep 'smoke-test'

          kill $PID
