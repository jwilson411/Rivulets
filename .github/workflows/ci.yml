name: CI

# docs/infrastructure/cicd-and-observability.md#ci-pipeline-github-actions
# Runs on every push to develop/main and on PRs: lint + type-check + unit
# tests for both server and ui in parallel, then a build check and an
# integration smoke test against the packaged binary.
#
# NOTE: Actions below are pinned to major-version tags, not commit SHAs.
# security-and-dr.md calls for SHA-pinning all actions — that hardening
# step needs real, verified SHAs and hasn't been done yet; don't treat
# this file as meeting that bar as-is.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

jobs:
  lint-server:
    name: Lint (server)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
      - working-directory: server
        run: |
          uv sync --dev
          uv run ruff check .
          uv run ruff format --check .

  typecheck-server:
    name: Type check (server)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
      - working-directory: server
        run: |
          uv sync --dev
          uv run pyright

  test-server:
    name: Unit tests (server)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
      - working-directory: server
        run: |
          uv sync --dev
          # TODO: raise toward the 85% NFR target (see pyproject.toml comment)
          # as test coverage grows.
          uv run pytest --cov-fail-under=76

  lint-ui:
    name: Lint (ui)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - working-directory: ui
        run: |
          npm ci
          npm run lint

  typecheck-ui:
    name: Type check (ui)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - working-directory: ui
        run: |
          npm ci
          npm run check

  test-ui:
    name: Unit tests (ui)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - working-directory: ui
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run test:unit -- --run

  build-check:
    name: Build check
    needs: [lint-server, typecheck-server, test-server, lint-ui, typecheck-ui, test-ui]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Build UI
        working-directory: ui
        run: |
          npm ci
          npm run build
      - name: Build server binary (PyInstaller)
        working-directory: server
        run: |
          uv sync --group packaging
          uv run --group packaging pyinstaller ../packaging/linux.spec \
            --distpath ../dist --workpath ../build/pyinstaller --noconfirm
      - uses: actions/upload-artifact@v4
        with:
          name: agent-hive-linux-amd64
          path: dist/agent-hive-linux-amd64
          retention-days: 7

  integration-test:
    name: Integration test (health, create agent, verify)
    needs: build-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: agent-hive-linux-amd64
          path: dist
      # Mirrors docs/infrastructure/cicd-and-observability.md's documented
      # smoke test script: start binary, health check, create an agent via
      # the API, verify it exists.
      - name: Smoke test
        run: |
          chmod +x dist/agent-hive-linux-amd64
          export AGENT_HIVE_WORKSPACE_DIR="$(mktemp -d)"
          ./dist/agent-hive-linux-amd64 &
          PID=$!
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:8484/api/v1/health && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8484/api/v1/health | grep '"status":"ok"'

          TOKEN=$(curl -sf -X POST http://127.0.0.1:8484/api/v1/auth/login \
            -H "Content-Type: application/json" \
            -d '{"key":"abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon about"}' \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['token'])")

          curl -sf -X POST http://127.0.0.1:8484/api/v1/agents \
            -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
            -d '{"name":"smoke-test","description":"Smoke test agent for CI","instructions":"You are a test agent. Respond with OK.","model":"test:mock"}' \
            | grep '"name":"smoke-test"'

          curl -sf http://127.0.0.1:8484/api/v1/agents \
            -H "Authorization: Bearer $TOKEN" | grep 'smoke-test'

          kill $PID
