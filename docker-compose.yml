# docker compose up -d       # start
# docker compose logs -f     # watch it
# docker compose down        # stop (workspace data survives — it's in the volume)
#
# Published loopback-only (127.0.0.1:8484) by default, matching a native
# install's NFR-3.4 posture: reachable from this machine only — first login
# works out of the box, no token needed, same as a native install. To
# expose it to your LAN instead, change the port mapping below to
# "8484:8484" — do that deliberately, not by accident, since Rivulets has
# no built-in network auth beyond the workspace key. If you do, also
# uncomment both environment lines below (#247/#318, README.md's Docker
# section) before the first login: the container binds 0.0.0.0 internally
# regardless of this port mapping, so RIVULETS_APP_SERVER_HOST alone can't
# tell loopback-only publishing apart from LAN publishing — without the
# token, anyone who reaches the LAN-published port before you've logged in
# once could otherwise claim the workspace with their own recovery phrase.
services:
  rivulets:
    build: .
    image: rivulets:local
    ports:
      - "127.0.0.1:8484:8484"
    # environment:
    #   RIVULETS_REQUIRE_BOOTSTRAP_TOKEN: "1"
    #   RIVULETS_BOOTSTRAP_TOKEN: ${RIVULETS_BOOTSTRAP_TOKEN:?set this before exposing beyond loopback}
    volumes:
      - rivulets-data:/data
    restart: unless-stopped
    # Least-privilege container: the process already runs as a non-root
    # user (see Dockerfile) and needs no Linux capability beyond that —
    # it doesn't bind a privileged port, chown outside /data, or manage
    # devices. no-new-privileges blocks setuid/setgid-based escalation
    # (irrelevant here since firejail, which needs it, isn't installed —
    # see docs/security.md — but harmless to keep on regardless).
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Not enabled by default: read_only: true would additionally lock down
    # the root filesystem, but needs a tmpfs mount for /tmp (and possibly
    # /home/rivulets, depending on what libraries in use cache there) to
    # avoid breaking things that expect a writable scratch dir outside
    # /data. Add it yourself if you've verified your setup doesn't need
    # writes outside /data and /tmp:
    #   read_only: true
    #   tmpfs:
    #     - /tmp

volumes:
  rivulets-data:
