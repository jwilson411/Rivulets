[project]
name = "rivulets"
version = "0.6.0"
description = "Local-first, P2P-synced workspace for humans and AI agent teams, built on AgentOS."
readme = "README.md"
authors = [
    { name = "Justin Wilson", email = "jammin411@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "agno>=2.8,<3.0",
    "aiosqlite>=0.22.1",
    "alembic>=1.13",
    "anthropic>=0.120.2",
    "bcrypt>=5.0.0",
    "cohere>=7.0.8",
    "croniter>=2.0.5",
    "cryptography>=50.0.0",
    "fastapi>=0.115",
    "google-genai>=2.17.0",
    "groq>=1.6.0",
    "httpx>=0.28.1",
    "keyring>=25.7.0",
    "libp2p>=0.7.0",
    "mcp>=1.9.2,<2",
    "mistralai>=2.9.1",
    "mnemonic>=0.21",
    "ollama>=0.6.2",
    "openai>=2.53.0",
    "pydantic-settings>=2.14.2",
    "pyjwt>=2.9",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "sqlalchemy[asyncio]>=2.0.51",
    "uvicorn[standard]>=0.52.1",
]

[project.scripts]
rivulets = "rivulets:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "pytest-xdist>=3",
    "ruff>=0.7",
]
packaging = [
    "pyinstaller>=6.21.0",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "S", "UP", "B"]
ignore = ["S101"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.11"
# Left unset, pyright defaults to the OS it's running on (Linux in CI,
# whatever a contributor's machine is locally) and statically narrows
# every `if sys.platform == "..."` branch that doesn't match — code for
# other platforms gets flagged reportUnreachable/reportUnusedFunction,
# and which branch that is flips depending on who's running the check.
# Rivulets ships on Linux/macOS/Windows (ADR-008 etc.), so all platforms'
# code paths need to type-check regardless of the checking machine.
pythonPlatform = "All"
typeCheckingMode = "strict"

# Strict mode is enforced for application code. A few directories get
# relaxed Unknown-type reporting because the gaps are in third-party stubs
# we don't control, not in our code: agno.tools.tool's decorator overloads
# erase type info (tools/builtin), httpx/starlette's TestClient responses
# are untyped (tests), and py-libp2p / multiaddr ship no py.typed stubs at
# all (sync) — trio itself is typed, but everything from `libp2p` and
# `multiaddr` comes back as Unknown.
[[tool.pyright.executionEnvironments]]
root = "src/rivulets/tools/builtin"
reportUnknownVariableType = false

[[tool.pyright.executionEnvironments]]
root = "src/rivulets/sync"
reportMissingTypeStubs = false
reportUnknownVariableType = false
reportUnknownMemberType = false
reportUnknownArgumentType = false

[[tool.pyright.executionEnvironments]]
root = "tests"
reportUnknownVariableType = false
reportUnknownMemberType = false
reportUnknownArgumentType = false
# Tests import private helpers (_run_message_dispatch, _find_*_call, etc.)
# to pin internal contracts. That's intentional; ruff S101 is already off.
reportPrivateUsage = false
# `from tests.conftest import ...` (and tests.test_channels) is valid at
# runtime because pytest puts the server root on sys.path. Pyright does
# not treat `tests` as an importable package unless extraPaths is the
# project root, and that extraPaths setting makes the installed
# `rivulets` package look untyped. Suppress the false positive instead.
reportMissingImports = false

[tool.pytest.ini_options]
addopts = "--cov=rivulets --cov-report=term-missing"
asyncio_mode = "auto"
testpaths = ["tests"]
# CI enforces --cov-fail-under=95 (see .github/workflows/ci.yml) — not set
# here so local runs aren't blocked while iterating on a single module.

[tool.coverage.run]
# The `client` fixture (tests/conftest.py) wraps FastAPI's TestClient, which
# runs the whole ASGI app -- every route handler -- inside a separate OS
# thread via anyio's blocking portal (starlette.testclient.TestClient.
# __enter__). Without `core = "sysmon"`, coverage.py 7.x on Python 3.12
# defaults to its legacy C tracer, which does not reliably attribute line
# hits for coroutines resumed from that portal thread: entire branches of
# well-tested route handlers (api/mcp_servers.py, api/channels.py, etc.)
# showed up as "uncovered" despite dedicated passing tests exercising them.
# Python 3.12's sys.monitoring-based tracer doesn't have this gap.
core = "sysmon"
