[project]
name = "rivulets"
version = "0.1.0"
description = "Local-first, P2P-synced workspace for humans and AI agent teams, built on AgentOS."
readme = "README.md"
authors = [
    { name = "Justin Wilson", email = "jammin411@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "agno>=2.8,<3.0",
    "aiosqlite>=0.22.1",
    "alembic>=1.13",
    "anthropic>=0.120.2",
    "bcrypt>=5.0.0",
    "cryptography>=50.0.0",
    "fastapi>=0.115",
    "httpx>=0.28.1",
    "keyring>=25.7.0",
    "libp2p>=0.7.0",
    "mcp>=1.9.2,<2",
    "mnemonic>=0.21",
    "openai>=2.53.0",
    "pydantic-settings>=2.14.2",
    "pyjwt>=2.9",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "sqlalchemy[asyncio]>=2.0.51",
    "uvicorn[standard]>=0.52.1",
]

[project.scripts]
rivulets = "rivulets:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "pytest-xdist>=3",
    "ruff>=0.7",
]
packaging = [
    "pyinstaller>=6.21.0",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "S", "UP", "B"]
ignore = ["S101"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "strict"

# Strict mode is enforced for application code. A few directories get
# relaxed Unknown-type reporting because the gaps are in third-party stubs
# we don't control, not in our code: agno.tools.tool's decorator overloads
# erase type info (tools/builtin), httpx/starlette's TestClient responses
# are untyped (tests), and py-libp2p / multiaddr ship no py.typed stubs at
# all (sync) — trio itself is typed, but everything from `libp2p` and
# `multiaddr` comes back as Unknown.
[[tool.pyright.executionEnvironments]]
root = "src/rivulets/tools/builtin"
reportUnknownVariableType = false

[[tool.pyright.executionEnvironments]]
root = "src/rivulets/sync"
reportMissingTypeStubs = false
reportUnknownVariableType = false
reportUnknownMemberType = false
reportUnknownArgumentType = false

[[tool.pyright.executionEnvironments]]
root = "tests"
reportUnknownVariableType = false
reportUnknownMemberType = false
reportUnknownArgumentType = false

[tool.pytest.ini_options]
addopts = "--cov=rivulets --cov-report=term-missing"
asyncio_mode = "auto"
testpaths = ["tests"]
# CI enforces --cov-fail-under (see .github/workflows/ci.yml) — not set here so
# local runs during early scaffolding aren't blocked before the suite has grown.
# NFR/CI-doc target is 85%; CI is currently gated at a lower baseline that
# matches real coverage today (~77%) and should ratchet up as tests are added.
