[alembic]
script_location = %(here)s/src/rivulets/db/migrations

# Dev-only default for `alembic revision --autogenerate` and other CLI
# usage against a scratch DB. The real app never reads this file -- it
# builds an in-memory alembic Config and shares its already-open
# connection to the real workspace DB (see rivulets.db.migrate).
sqlalchemy.url = sqlite:///dev.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
